name: signal_brief
description: A finite, filtered daily brief with study tools, to replace doomscrolling.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  dart_rss: ^3.0.3
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  # Share-to-app is handled by MainActivity.kt + the signal/share channel,
  # so there is no receive_sharing_intent dependency to version-manage.
  path_provider: ^2.1.6
  crypto: ^3.0.7
  share_plus: ^13.3.1
  html: ^0.15.7
  flutter_dotenv: ^6.0.1
  # Music: resolve a shared YouTube link to an audio stream, save it on the
  # device, and play it back in-app.
  just_audio: ^0.10.6
  youtube_explode_dart: ^3.1.0
  # A saved video is a real 360p MP4, so it plays with picture: audio goes
  # through just_audio, video through the platform player.
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    # Local secrets. `.env` is gitignored — copy `.env.example` to create it.
    - .env
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon_full.png"
  adaptive_icon_background: "#0A0B09"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon_full.png"
    background_color: "#0A0B09"
    theme_color: "#D3F08A"

flutter_native_splash:
  color: "#0A0B09"
  image: assets/icon/splash.png
  android_12:
    color: "#0A0B09"
    image: assets/icon/splash.png
    icon_background_color: "#0A0B09"
  android: true
  ios: true
  web: true
